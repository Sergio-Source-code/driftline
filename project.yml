name: App
options:
  bundleIdPrefix: ai.mobilecode
  deploymentTarget:
    iOS: "17.0"
targets:
  App:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - Tests
          - Tools
    preBuildScripts:
      - name: Draw original sunset icon
        script: 'python3 "${SRCROOT}/App/Tools/render_icon.py" "${SRCROOT}/App/Assets.xcassets/AppIcon.appiconset"'
        inputFiles:
          - $(SRCROOT)/App/Tools/render_icon.py
        outputFiles:
          - $(SRCROOT)/App/Assets.xcassets/AppIcon.appiconset/DriftlineIcon.png
          - $(SRCROOT)/App/Assets.xcassets/AppIcon.appiconset/Contents.json
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.mobilecode.app
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Driftline
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"